<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Amherst Fire Control — CAD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0c0e12;--panel:#13161c;--panel2:#191d24;--panel3:#1f242e;
  --border:#252a35;--border2:#2e3440;
  --blue:#c0392b;--blue-bright:#e74c3c;--blue-dim:rgba(192,57,43,0.1);
  --red:#c0392b;--red-bright:#e74c3c;--red-dim:rgba(192,57,43,0.1);
  --amber:#d68910;--amber-bright:#f39c12;--amber-dim:rgba(214,137,16,0.1);
  --green:#1e8449;--green-bright:#27ae60;--green-dim:rgba(30,132,73,0.1);
  --text:#dde2ea;--text2:#8892a0;--text3:#4a5568;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
  --svc-police:#2d7dd2;
  --svc-fire:#e74c3c;
}
html,body{height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;}
.topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--blue);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:50;}
.tb-shield{width:28px;height:28px;background:var(--blue);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-shield svg{width:15px;height:15px;fill:white;}
.tb-org{display:flex;flex-direction:column;line-height:1.2;}
.tb-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;}
.tb-sub{font-size:9px;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.tb-name-short{display:none;}
.tb-sep{width:1px;height:24px;background:var(--border2);flex-shrink:0;}
.tb-pill{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--border2);padding:3px 10px;border-radius:3px;}
.tb-pill-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);}
.tb-pill-dot.on{background:var(--green-bright);animation:blink 2s ease-in-out infinite;}
.tb-pill-dot.err{background:var(--red-bright);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tb-pill-lbl{font-size:10px;color:var(--text2);font-family:var(--mono);letter-spacing:.5px;}
.tb-pill-mobile{display:none;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tb-clock{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--blue-bright);letter-spacing:1.5px;}
.tb-date{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.5px;text-align:right;}
.scanbar{height:36px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.sb-tag{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;}
.sb-freq{font-family:var(--mono);font-size:10px;color:var(--blue-bright);margin-left:2px;}
.sb-viz{display:flex;align-items:center;gap:2px;height:18px;}
.sb-viz span{display:block;width:2px;background:var(--blue);border-radius:1px;height:3px;opacity:.2;}
.sb-viz.active span{opacity:.9;animation:vb .65s ease-in-out infinite;}
.sb-viz.active span:nth-child(1){animation-delay:0s}.sb-viz.active span:nth-child(2){animation-delay:.07s}
.sb-viz.active span:nth-child(3){animation-delay:.14s}.sb-viz.active span:nth-child(4){animation-delay:.21s}
.sb-viz.active span:nth-child(5){animation-delay:.10s}.sb-viz.active span:nth-child(6){animation-delay:.17s}
.sb-viz.active span:nth-child(7){animation-delay:.03s}.sb-viz.active span:nth-child(8){animation-delay:.24s}
@keyframes vb{0%,100%{height:3px}50%{height:15px}}
.sb-onair{font-family:var(--mono);font-size:9px;color:var(--red-bright);letter-spacing:2px;display:none;}
.sb-onair.active{display:block;animation:blink 1s ease-in-out infinite;}
.sb-btn{font-family:var(--mono);font-size:9px;letter-spacing:1px;background:transparent;border:1px solid var(--border2);color:var(--text2);padding:3px 10px;cursor:pointer;border-radius:2px;transition:all .15s;margin-left:auto;}
.sb-btn:hover{border-color:var(--blue);color:var(--blue-bright);}
.sb-btn.on{border-color:var(--red-bright);color:var(--red-bright);}
audio{display:none;}
.stats{display:flex;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.stat{flex:1;padding:8px 14px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:1px;min-width:0;}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:9px;font-weight:500;color:var(--text3);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-n{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.1;}
.c-blue{color:var(--blue-bright);}.c-red{color:var(--red-bright);}.c-green{color:var(--green-bright);}.c-amber{color:var(--amber-bright);}
.workspace{display:flex;flex:1;overflow:hidden;min-height:0;}
.feed-col{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;}
.col-hdr{padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.col-hdr-title{font-size:10px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.col-hdr-count{font-family:var(--mono);font-size:10px;color:var(--blue-bright);}
.feed{flex:1;overflow-y:auto;}.feed::-webkit-scrollbar{width:3px;}.feed::-webkit-scrollbar-thumb{background:var(--border2);}
.irow{display:grid;grid-template-columns:3px 1fr auto;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.irow:hover{background:var(--panel2);}
.irow.new-in{animation:flash .7s ease-out;}
@keyframes flash{0%{background:rgba(231,76,60,.12)}100%{background:transparent}}
.irow-bar{width:3px;align-self:stretch;background:var(--border2);}
.irow-bar.high{background:var(--red-bright);}.irow-bar.medium{background:var(--amber-bright);}.irow-bar.low{background:var(--green-bright);}.irow-bar.unknown{background:var(--text3);}
.irow-body{padding:10px 12px;min-width:0;}
.irow-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px;}
.irow-type{font-size:13px;font-weight:600;color:#fff;}
.irow-time{font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap;padding-top:2px;}
.irow-loc{font-family:var(--mono);font-size:11px;color:var(--blue-bright);margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.irow-loc svg{width:10px;height:10px;fill:currentColor;opacity:.6;flex-shrink:0;}
.irow-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pri-tag{font-family:var(--mono);font-size:9px;letter-spacing:.8px;padding:2px 6px;border-radius:2px;text-transform:uppercase;border:1px solid transparent;}
.pri-tag.high{background:var(--red-dim);color:var(--red-bright);border-color:rgba(231,76,60,.2);}
.pri-tag.medium{background:var(--amber-dim);color:var(--amber-bright);border-color:rgba(243,156,18,.2);}
.pri-tag.low{background:var(--green-dim);color:var(--green-bright);border-color:rgba(39,174,96,.2);}
.pri-tag.unknown{background:rgba(74,85,104,.15);color:var(--text3);border-color:var(--border);}
.unit-chip{font-family:var(--mono);font-size:9px;padding:2px 6px;background:var(--blue-dim);border:1px solid rgba(231,76,60,.2);color:var(--blue-bright);border-radius:2px;}
.audio-badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9px;padding:2px 6px;background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.2);color:var(--green-bright);border-radius:2px;}
.audio-badge svg{width:9px;height:9px;fill:currentColor;}
.irow-notes{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4;}
.irow-arr{padding:10px 10px 10px 0;display:flex;align-items:center;color:var(--text3);font-size:12px;}
.side{width:290px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--panel);height:100%;min-height:0;}
.tx-feed{flex:1;overflow-y:auto;min-height:0;}.tx-feed::-webkit-scrollbar{width:3px;}.tx-feed::-webkit-scrollbar-thumb{background:var(--border2);}
.tx-line-row{padding:5px 12px;border-bottom:1px solid var(--border);animation:fadeUp .35s ease-out;display:flex;gap:8px;align-items:baseline;}
@keyframes fadeUp{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.tx-line-time{font-family:var(--mono);font-size:9px;color:var(--text3);flex-shrink:0;white-space:nowrap;}
.tx-line-text{font-family:var(--mono);font-size:11.5px;color:var(--text2);line-height:1.5;}
.bkdn{border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0;}
.bkdn-ttl{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.bkdn-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.bkdn-lbl{font-size:10px;color:var(--text2);width:85px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bkdn-track{flex:1;height:3px;background:var(--border2);border-radius:2px;overflow:hidden;}
.bkdn-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .5s ease;}
.bkdn-n{font-family:var(--mono);font-size:10px;color:var(--text3);width:18px;text-align:right;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;}
.empty svg{width:32px;height:32px;stroke:var(--text3);fill:none;stroke-width:1.5;opacity:.4;}
.empty-msg{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;font-family:var(--mono);}
.toast{position:fixed;bottom:16px;right:16px;z-index:9000;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--blue);border-radius:3px;padding:10px 14px;min-width:220px;max-width:280px;animation:toastIn .25s ease-out;}
.toast.high{border-left-color:var(--red-bright);}.toast.medium{border-left-color:var(--amber-bright);}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast-hd{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.toast-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.toast.high .toast-dot{background:var(--red-bright);}.toast.medium .toast-dot{background:var(--amber-bright);}
.toast-type{font-size:12px;font-weight:600;color:#fff;}
.toast-loc{font-family:var(--mono);font-size:10px;color:var(--text2);}

/* Desktop segmented toggle — sits in the topbar, right of the clock */
.svc-toggle{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--border2);border-radius:4px;overflow:hidden;margin-left:14px;flex-shrink:0;}
.svc-toggle a{display:block;padding:5px 14px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;text-decoration:none;color:var(--text3);transition:all .15s;white-space:nowrap;}
.svc-toggle a.fire{border-right:1px solid var(--border2);}
.svc-toggle a:hover{color:var(--text2);}
.svc-toggle a.active.police{background:var(--svc-police);color:#fff;}
.svc-toggle a.active.fire{background:var(--svc-fire);color:#fff;}

/* Mobile skinny row — sits directly under the Incidents/Radio tab bar */
.svc-toggle-mobile{display:none;border-top:1px solid var(--border);flex-shrink:0;}
.svc-toggle-mobile-inner{display:flex;}
.svc-toggle-mobile a{flex:1;text-align:center;padding:7px 0;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;color:var(--text3);background:var(--panel2);transition:all .15s;}
.svc-toggle-mobile a.fire{border-right:1px solid var(--border2);}
.svc-toggle-mobile a.active.police{background:var(--svc-police);color:#fff;}
.svc-toggle-mobile a.active.fire{background:var(--svc-fire);color:#fff;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:8000;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:4px;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;animation:modalIn .2s ease-out;overflow:hidden;}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;background:var(--panel2);flex-shrink:0;}
.modal-hdr-left{display:flex;align-items:center;gap:10px;}
.modal-hdr-bar{width:4px;height:32px;border-radius:2px;background:var(--blue);}
.modal-hdr-bar.high{background:var(--red-bright);}.modal-hdr-bar.medium{background:var(--amber-bright);}.modal-hdr-bar.low{background:var(--green-bright);}
.modal-title{font-size:16px;font-weight:700;color:#fff;}
.modal-sub{font-size:11px;color:var(--text2);margin-top:1px;font-family:var(--mono);}
.modal-close{background:transparent;border:1px solid var(--border2);color:var(--text2);width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.modal-close:hover{border-color:var(--red-bright);color:var(--red-bright);}
.modal-body{overflow-y:auto;flex:1;}.modal-body::-webkit-scrollbar{width:4px;}.modal-body::-webkit-scrollbar-thumb{background:var(--border2);}
.m-section{border-bottom:1px solid var(--border);padding:14px 18px;}
.m-section:last-child{border-bottom:none;}
.m-section-title{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px;}
.m-table{width:100%;border-collapse:collapse;}
.m-table tr{border-bottom:1px solid var(--border);}
.m-table tr:last-child{border-bottom:none;}
.m-table td{padding:7px 0;vertical-align:top;font-size:12px;}
.m-table td:first-child{color:var(--text2);width:140px;font-weight:500;padding-right:12px;}
.m-table td:last-child{color:var(--text);font-family:var(--mono);font-size:11px;}
.m-chips{display:flex;gap:5px;flex-wrap:wrap;}
.m-chip{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:2px;background:var(--blue-dim);border:1px solid rgba(231,76,60,.2);color:var(--blue-bright);}
.m-chip.red{background:var(--red-dim);border-color:rgba(231,76,60,.2);color:var(--red-bright);}
.m-chip.amber{background:var(--amber-dim);border-color:rgba(243,156,18,.2);color:var(--amber-bright);}
.m-chip.green{background:var(--green-dim);border-color:rgba(39,174,96,.2);color:var(--green-bright);}
.m-id{font-family:var(--mono);font-size:10px;color:var(--text3);}
.m-pri{display:inline-flex;align-items:center;gap:6px;}
.m-pri-dot{width:8px;height:8px;border-radius:50%;}
.loc-link{color:var(--blue-bright);text-decoration:none;font-family:var(--mono);font-size:11px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;border-bottom:1px solid rgba(231,76,60,.3);padding-bottom:1px;transition:border-color .15s;}
.loc-link:hover{border-color:var(--blue-bright);}
.loc-link svg{width:11px;height:11px;fill:currentColor;opacity:.7;flex-shrink:0;}
.map-container{margin-top:8px;border:1px solid var(--border2);border-radius:3px;overflow:hidden;height:200px;background:var(--panel3);display:none;}
.map-container.visible{display:block;}
.map-container iframe{width:100%;height:100%;border:none;display:block;}
.map-toggle-hint{font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:6px;opacity:.6;}
.m-tx-box{background:var(--panel2);border:1px solid var(--border2);border-radius:3px;padding:10px 12px;}
.m-tx-line{font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.65;display:block;padding:2px 0;}
.m-tx-line+.m-tx-line{border-top:1px solid rgba(255,255,255,.05);margin-top:4px;padding-top:6px;}

.audio-player{background:var(--panel2);border:1px solid var(--border2);border-radius:3px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.audio-player-row{display:flex;align-items:center;gap:10px;}
.ap-play{width:32px;height:32px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.ap-play:hover{background:var(--blue-bright);}
.ap-play svg{width:13px;height:13px;fill:white;margin-left:2px;}
.ap-play.playing svg{margin-left:0;}
.ap-progress-wrap{flex:1;display:flex;flex-direction:column;gap:4px;}
.ap-bar-track{height:4px;background:var(--border2);border-radius:2px;cursor:pointer;position:relative;}
.ap-bar-fill{height:100%;background:var(--blue);border-radius:2px;width:0%;transition:width .1s linear;}
.ap-times{display:flex;justify-content:space-between;}
.ap-time{font-family:var(--mono);font-size:9px;color:var(--text3);}
.ap-vol{display:flex;align-items:center;gap:6px;}
.ap-vol svg{width:12px;height:12px;fill:var(--text3);flex-shrink:0;}
.ap-vol-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border2);border-radius:2px;outline:none;cursor:pointer;}
.ap-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--blue-bright);cursor:pointer;}
.ap-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;}
.ap-no-audio{font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px 0;display:flex;align-items:center;gap:6px;}
.ap-no-audio svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:1.5;}

.mob-nav{display:none;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.mob-nav-inner{display:flex;}
.mnb{flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;cursor:pointer;color:var(--text3);border-top:2px solid transparent;transition:all .15s;}
.mnb.active{color:var(--blue-bright);border-top-color:var(--blue-bright);}
.mnb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;}
.mnb-lbl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;font-family:var(--mono);}
@media(max-width:860px){.side{display:none;}.stat .stat-lbl{font-size:8px;}.stat-n{font-size:18px;}}
@media(max-width:580px){
  .tb-pill-desktop{display:none;}.tb-pill-mobile{display:flex;}
  .topbar{padding:0 10px;}.tb-sub,.tb-date{display:none;}.tb-clock{font-size:14px;}
  .tb-name-full{display:none;}.tb-name-short{display:inline;}
  .stats{overflow-x:auto;}.stat{min-width:68px;padding:6px 10px;}
  .workspace{flex-direction:column;}
  .feed-col{border-right:none;}
  .side{width:100%;display:none;border-left:none;border-top:1px solid var(--border);}
  .side.mob-show{display:flex;}
  .mob-nav{display:block;}.modal{max-height:95vh;}
  .svc-toggle{display:none;}
  .svc-toggle-mobile{display:block;}
}
@media(min-width:581px) and (max-width:860px){.stats .stat:nth-child(4){display:none;}}

/* Pull-to-refresh — mobile "Active Calls" feed */
.ptr-wrap{
  height:0;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);
  flex-shrink:0;
  transition:height .22s ease;
}
.ptr-wrap.no-transition{transition:none;}
.ptr-spinner{
  width:18px;height:18px;
  border:2px solid var(--border2);
  border-top-color:var(--blue-bright);
  border-radius:50%;
  opacity:0;
}
.ptr-spinner.spin{animation:ptrSpin .6s linear infinite;}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-shield"><svg viewBox="0 0 24 24"><path d="M12 2C9 6 6 9 6 13a6 6 0 0012 0c0-2-1-3.5-2-5 .3 2-.7 3-1.5 3.3.6-2.3-.3-4.6-2.5-7.3z"/></svg></div>
  <div class="tb-org">
    <div class="tb-name"><span class="tb-name-full">Amherst Fire Control</span><span class="tb-name-short">Amherst Fire</span></div>
    <div class="tb-sub">Computer Aided Dispatch · Erie County NY</div>
  </div>

function applyKeywordBank(text) {
  if (!text) return text;
  let out = text;
  for (const wrong in KEYWORD_BANK) {
    const right = KEYWORD_BANK[wrong];
    const escaped = wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`\\b${escaped}\\b`, 'gi');
    out = out.replace(re, right);
  }
  return out;
}

// Dispatch convention: "6-6 Bruce Road" means house number 66, not a range —
// so for LOCATIONS ONLY, collapse any "number - number" into one number by
// dropping the dash. (Not applied to general transcript text, which can
// contain real dashed codes like "10-4" that must stay intact.)
function collapseNumberDashes(text) {
  if (!text) return text;
  return text.replace(/\b(\d+)\s*-\s*(\d+)\b/g, '$1$2');
}

// The one function to call anywhere a LOCATION string is displayed or
// geocoded — applies keyword corrections, then the number-dash collapse.
function normalizeLocationText(text) {
  return collapseNumberDashes(applyKeywordBank(text || ''));
}

// ── Address validation ──────────────────────────────────────────────────
// Only skip the incident card if the location is unknown/empty. No format
// check is applied — any non-empty, non-"unknown" location is accepted.
function isValidAddress(rawLoc) {
  if (!rawLoc) return false;
  const loc = normalizeLocationText(rawLoc).trim();
  if (!loc || loc.length < 5) return false;
  if (/^unknown/i.test(loc)) return false;
  return true;
}

// ── Known Fire Departments / Stations ────────────────────────────────────
// Add every department/station name that could respond to a call here.
// getStationLabel() scans (in order: unit field, then transcript, then
// notes — whichever has text) for the FIRST department on this list it
// finds, case-insensitive, whole-word. "aliases" covers alternate spellings
// that show up after the keyword bank runs (e.g. both "Eggertsville" and
// "Eggertsville" appear as keyword-bank targets elsewhere in this file).
//
// ORDER MATTERS: a multi-word name that CONTAINS another entry on this list
// must come first, or the shorter one will match inside it — e.g. "East
// Amherst" has to be checked before plain "Amherst", since "\bAmherst\b"
// would otherwise match the "Amherst" inside "East Amherst" first.
//
// If nothing on this list is heard anywhere in the call, the department
// shows as "NA".
const DEPARTMENT_LIST = [
  { label: "East Amherst FD",   aliases: ["East Amherst"] },
  { label: "Eggertsville FD",   aliases: ["Eggertsville"] },
  { label: "Getzville FD",      aliases: ["Getzville"] },
  { label: "Williamsville FD",  aliases: ["Williamsville", "Hutchinson Hose", "Hutchinson"] },
  { label: "Swormsville FD",    aliases: ["Swormsville"] },
  { label: "Harris Hill FD",    aliases: ["Harris Hill"] },
  { label: "Newstead FD",       aliases: ["Newstead"] },
  { label: "Clarence FD",       aliases: ["Clarence"] },
  { label: "Akron FD",          aliases: ["Akron"] },
  { label: "Snyder FD",         aliases: ["Snyder"] },
  { label: "Main Transit FD",   aliases: ["Main Transit"] },
  { label: "Ellicott Creek FD", aliases: ["Ellicott Creek"] },
  { label: "Rapids Fire FD",    aliases: ["Rapids Fire", "Rapid", "Rapids"] },
  { label: "North Amherst FD",  aliases: ["North Amherst"] },
  { label: "Clarence Center F", aliases: ["Clarence Center"] },
  { label: "North Bailey FD",   aliases: ["North Bailey", "Bailey"] },
  { label: "Swarmville FD",     aliases: ["Swarmville"] },
];

function findDepartmentInText(rawText) {
  if (!rawText) return null;
  const text = applyKeywordBank(String(rawText));
  for (const dept of DEPARTMENT_LIST) {
    for (const alias of dept.aliases) {
      const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b${escaped}\\b`, 'i');
      if (re.test(text)) return dept.label;
    }
  }
  return null;
}

function getStationLabel(inc) {
  // 1. Units field first — short and usually the clearest signal.
  for (const u of (inc.units || [])) {
    const found = findDepartmentInText(u);
    if (found) return found;
  }
  // 2. Fall back to scanning the full transcript, then the notes.
  return findDepartmentInText(inc.transcript) || findDepartmentInText(inc.notes) || 'NA';
}

// The radio log is unstructured — we still split each stored transcript
// blob into readable lines client-side, same trick as the incident view,
// but these lines are NOT tied to any incident card.
// Detects a phrase that's immediately repeated back-to-back (e.g. dispatch
// echoing back what a unit just said, with no punctuation between the two
// copies — "Newstead 8 on location Newstead 8 on location") and inserts a
// split marker between the two copies so they render as separate lines.
function splitRepeatedPhrases(text) {
  const words = text.split(/\s+/).filter(Boolean);
  const n = words.length;
  if (n < 4) return text; // too short to contain a meaningful repeat

  const norm = w => w.toLowerCase().replace(/[^\w]/g, '');
  const breakpoints = new Set();

  for (let i = 0; i < n; i++) {
    const maxLen = Math.min(8, Math.floor((n - i) / 2)); // cap phrase length at 8 words
    for (let L = maxLen; L >= 2; L--) { // try longest match first
      let match = true;
      for (let k = 0; k < L; k++) {
        const a = norm(words[i + k]);
        const b = norm(words[i + L + k]);
        if (!a || a !== b) { match = false; break; }
      }
      if (match) {
        breakpoints.add(i + L); // split right before the second copy starts
        i += (2 * L - 1);       // skip past the whole repeated pair
        break;
      }
    }
  }

  if (breakpoints.size === 0) return text;

  let out = '';
  words.forEach((w, idx) => {
    if (breakpoints.has(idx)) out += '|||';
    out += w + ' ';
  });
  return out.trim();
}

function splitTranscript(text) {
  if (!text || !text.trim()) return [text || ''];
  const withRepeatSplits = splitRepeatedPhrases(text);
  const lines = withRepeatSplits
    .replace(/([.!?])\s+([A-Z])/g, '$1|||$2')
    .replace(/,\s+(unit\s+\d|[A-Z]\d{2,})/gi, '|||$1')
    .split('|||').map(s => s.trim()).filter(s => s.length > 3);
  return lines.length > 0 ? lines : [text];
}

// ── Scanner audio toggle ───────────────────────────────────────────────────
const STREAM_HLS_URL = "https://hls-o1.broadcastify.com/s1/feed/1775/playlist.m3u8";
let hlsInstance = null;

function initScannerAudio() {
  const audio = document.getElementById('scanner-audio');

  if (window.Hls && Hls.isSupported()) {
    hlsInstance = new Hls({
      liveSyncDurationCount: 3,
      maxBufferLength: 15,
    });
    hlsInstance.loadSource(STREAM_HLS_URL);
    hlsInstance.attachMedia(audio);
  } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
    audio.src = STREAM_HLS_URL;
  } else {
    console.error('HLS not supported in this browser');
  }
}

function toggleAudio() {
  const a = document.getElementById('scanner-audio');
  const btn = document.getElementById('sb-btn');
  const viz = document.getElementById('sb-viz');
  const oa  = document.getElementById('sb-onair');

  if (!hlsInstance && !a.src) initScannerAudio();

  if (a.paused) {
    a.play().catch(()=>{});
    btn.textContent='■ Stop'; btn.classList.add('on');
    viz.classList.add('active'); oa.classList.add('active');
  } else {
    a.pause();
    btn.textContent='▶ Monitor'; btn.classList.remove('on');
    viz.classList.remove('active'); oa.classList.remove('active');
  }
}

function mobTab(tab) {
  const feed = document.getElementById('view-feed');
  const side = document.getElementById('view-side');
  const bi = document.getElementById('mnb-inc'), br = document.getElementById('mnb-rad');
  if (tab === 'feed') {
    feed.style.display='flex'; side.classList.remove('mob-show');
    bi.classList.add('active'); br.classList.remove('active');
  } else {
    feed.style.display='none'; side.classList.add('mob-show');
    br.classList.add('active'); bi.classList.remove('active');
  }
}

async function fetchStats() {
  try {
    const res = await fetch(STATS_API);
    if (!res.ok) return;
    const s = await res.json();
    document.getElementById('stat-total').textContent = s.total;
    document.getElementById('stat-high').textContent  = s.high;
    document.getElementById('stat-last').textContent  = formatLastCall(s.last_call);
    document.getElementById('stat-rate').textContent  = s.rate;
    document.getElementById('incident-count').textContent = `${s.all_time} total · ${allIncidents.length} loaded`;

    const types  = s.breakdown || {};
    const sorted = Object.entries(types).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const max    = sorted[0]?.[1] || 1;
    document.getElementById('breakdown-list').innerHTML = sorted.map(([tp,ct]) => `
      <div class="bkdn-row">
        <div class="bkdn-lbl">${escHtml(tp)}</div>
        <div class="bkdn-track"><div class="bkdn-fill" style="width:${ct/max*100}%"></div></div>
        <div class="bkdn-n">${ct}</div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}

  document.getElementById('conn-dot-mobile').className = 'tb-pill-dot ' + (on ? 'on' : 'err');
}

function pClass(p) { return (p||'unknown').toLowerCase(); }

function formatLastCall(val) {
  if (!val) return val;
  if (window.innerWidth > 580) return val;
  const m = String(val).match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])$/);
  if (!m) return val;
  let h = parseInt(m[1], 10);
  const min = m[2];
  const isPM = m[3].toLowerCase() === 'pm';
  if (isPM && h !== 12) h += 12;
  if (!isPM && h === 12) h = 0;
  return String(h).padStart(2, '0') + ':' + min;
}

function makeIncidentId(inc) {
  const ts = inc.created_at ? new Date(inc.created_at).getTime() : Date.now();
  return 'FIR-' + String(ts).slice(-6).toUpperCase();
}

function renderRow(inc) {
  const pc = pClass(inc.priority);
  const station = `<span class="unit-chip">${escHtml(getStationLabel(inc))}</span>`;
  const priLabel = {high:'Priority 1',medium:'Priority 2',low:'Priority 3',unknown:'Unknown'}[pc]||inc.priority;
  const audioBadge = inc.audio_url
    ? `<span class="audio-badge"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>Audio</span>`
    : '';
  return `<div class="irow new-in" data-id="${inc.id}" onclick="openModal(${inc.id})">
    <div class="irow-bar ${pc}"></div>
    <div class="irow-body">
      <div class="irow-top"><div class="irow-type">${escHtml(inc.incident_type||'Unknown')}</div><div class="irow-time">${escHtml(inc.time_str||'')}</div></div>
      <div class="irow-loc"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${escHtml(normalizeLocationText(inc.location)||'Location Unknown')}</div>
      <div class="irow-foot"><span class="pri-tag ${pc}">${escHtml(priLabel)}</span>${station}${audioBadge}</div>
      ${inc.notes?`<div class="irow-notes">${escHtml(applyKeywordBank(inc.notes))}</div>`:''}
    </div>
    <div class="irow-arr">›</div>
  </div>`;
}

// Radio log rows are flat, timestamped lines — not grouped by incident.
function renderLogEntry(entry) {
  const lines = splitTranscript(applyKeywordBank(entry.text || ''));
  return lines.slice().reverse().map(l => `<div class="tx-line-row">
      <span class="tx-line-time">${escHtml(entry.time_str||'')}</span>
      <span class="tx-line-text">${escHtml(l)}</span>
    </div>`).join('');
}

// ── Audio player ──────────────────────────────────────────────────────────
let currentAudioEl = null;

function buildAudioPlayer(audioUrl) {
  if (!audioUrl) {
    return `<div class="ap-no-audio">
      <svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v4M8 23h8"/></svg>
      No audio clip saved for this incident
    </div>`;
  }
  const uid = 'ap_' + Date.now();
  return `<div class="audio-player">
    <div class="ap-label">▸ Radio Clip · Silence Cut</div>
    <div class="audio-player-row">
      <button class="ap-play" id="${uid}_btn" onclick="apToggle('${uid}','${escHtml(audioUrl)}')">
        <svg id="${uid}_icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <div class="ap-progress-wrap">
        <div class="ap-bar-track" id="${uid}_track" onclick="apSeek(event,'${uid}')">
          <div class="ap-bar-fill" id="${uid}_fill"></div>
        </div>
        <div class="ap-times">
          <span class="ap-time" id="${uid}_cur">0:00</span>
          <span class="ap-time" id="${uid}_dur">—</span>
        </div>
      </div>
      <div class="ap-vol">
        <svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        <input class="ap-vol-slider" type="range" min="0" max="1" step="0.05" value="1"
          oninput="apVol('${uid}',this.value)">
      </div>
    </div>
    <audio id="${uid}_audio" preload="metadata" src="${escHtml(audioUrl)}"></audio>
  </div>`;
}

function fmtTime(s) {
  if (!isFinite(s)) return '—';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return `${m}:${ss.toString().padStart(2,'0')}`;
}

function apToggle(uid, url) {
  const audio  = document.getElementById(uid + '_audio');
  const btn    = document.getElementById(uid + '_btn');
  const icon   = document.getElementById(uid + '_icon');
  const fill   = document.getElementById(uid + '_fill');
  const cur    = document.getElementById(uid + '_cur');
  const dur    = document.getElementById(uid + '_dur');

  if (currentAudioEl && currentAudioEl !== audio) {
    currentAudioEl.pause();
    const prevId = currentAudioEl.id.replace('_audio','');
    const prevIcon = document.getElementById(prevId + '_icon');
    const prevBtn  = document.getElementById(prevId + '_btn');
    if (prevIcon) prevIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
    if (prevBtn)  prevBtn.classList.remove('playing');
  }

  if (audio.paused) {
    audio.play().catch(()=>{});
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    btn.classList.add('playing');
    currentAudioEl = audio;

    audio.ontimeupdate = () => {
      cur.textContent  = fmtTime(audio.currentTime);
      dur.textContent  = fmtTime(audio.duration);
      fill.style.width = audio.duration ? (audio.currentTime / audio.duration * 100) + '%' : '0%';
    };
    audio.onended = () => {
      icon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
      btn.classList.remove('playing');
      fill.style.width = '0%';
      cur.textContent  = '0:00';
      currentAudioEl   = null;
    };
    audio.onloadedmetadata = () => { dur.textContent = fmtTime(audio.duration); };
  } else {
    audio.pause();
    icon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
    btn.classList.remove('playing');
    currentAudioEl = null;
  }
}

function apSeek(e, uid) {
  const audio = document.getElementById(uid + '_audio');
  const track = document.getElementById(uid + '_track');
  if (!audio || !audio.duration) return;
  const rect = track.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.currentTime = ratio * audio.duration;
}

function apVol(uid, val) {
  const audio = document.getElementById(uid + '_audio');
  if (audio) audio.volume = val;
}

// ── Map toggle ─────────────────────────────────────────────────────────────
function toggleMap(loc) {
  const container = document.getElementById('map-embed-container');
  if (!container) return;
  if (container.classList.contains('visible')) { container.classList.remove('visible'); return; }
  const q = encodeURIComponent(loc + ', Amherst NY');
  container.innerHTML = `<iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${q}&output=embed" allowfullscreen></iframe>`;
  container.classList.add('visible');
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(id) {
  const inc = incidentMap[id];
  if (!inc) return;

  if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl = null; }

  const pc = pClass(inc.priority);
  const priLabel = {high:'Priority 1 — High',medium:'Priority 2 — Medium',low:'Priority 3 — Low',unknown:'Unknown Priority'}[pc]||inc.priority;
  const priChipClass = {high:'red',medium:'amber',low:'green',unknown:''}[pc]||'';
  const incId = makeIncidentId(inc);
  const createdFull = inc.created_at
    ? new Date(inc.created_at).toLocaleString('en-US',{timeZone:'America/New_York',hour12:false})
    : '—';
  const stationChip = `<span class="m-chip">${escHtml(getStationLabel(inc))}</span>`;
  const loc = normalizeLocationText(inc.location) || 'Unknown';
  const locIsKnown = loc !== 'Unknown' && loc !== 'Unknown Location' && loc.length > 3;
  const locCell = locIsKnown
    ? `<span class="loc-link" onclick="toggleMap('${loc.replace(/'/g,"\\'")}')">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${escHtml(loc)}
       </span>
       <span class="map-toggle-hint">↓ click to map</span>
       <div class="map-container" id="map-embed-container"></div>`
    : escHtml(loc);

  document.getElementById('modal-title').textContent = inc.incident_type || 'Unknown Incident';
  document.getElementById('modal-sub').textContent   = `${incId} · ${inc.time_str||''} · ${loc}`;
  document.getElementById('modal-bar').className     = 'modal-hdr-bar ' + pc;

  document.getElementById('modal-body').innerHTML = `
    <div class="m-section">
      <div class="m-section-title">Incident Details</div>
      <table class="m-table">
        <tr><td>Incident ID</td><td><span class="m-id">${incId}</span></td></tr>
        <tr><td>Created</td><td>${createdFull} ET</td></tr>
        <tr><td>Type</td><td>${escHtml(inc.incident_type||'Unknown')}</td></tr>
        <tr><td>Priority</td><td><div class="m-pri"><div class="m-pri-dot" style="background:var(--${pc==='high'?'red':pc==='medium'?'amber':pc==='low'?'green':'text3'}-bright)"></div>${escHtml(priLabel)}</div></td></tr>
        <tr><td>Location</td><td>${locCell}</td></tr>
        <tr><td>Fire Department</td><td><div class="m-chips">${stationChip}</div></td></tr>
        <tr><td>Notes</td><td>${escHtml(applyKeywordBank(inc.notes||'')||'—')}</td></tr>
      </table>
    </div>
    <div class="m-section">
      <div class="m-section-title">Radio Recording</div>
      ${buildAudioPlayer(inc.audio_url || null)}
    </div>
    <div class="m-section">
      <div class="m-section-title">Dispatch Transcript</div>
      <div class="m-tx-box">${splitTranscript(applyKeywordBank(inc.transcript||'No transcript available.')).map(l=>`<span class="m-tx-line">${escHtml(l)}</span>`).join('')}</div>
    </div>
    <div class="m-section">
      <div class="m-section-title">Classification</div>
      <table class="m-table">
        <tr><td>Incident Type</td><td><span class="m-chip ${priChipClass}">${escHtml(inc.incident_type||'Unknown')}</span></td></tr>
        <tr><td>Priority Level</td><td><span class="m-chip ${priChipClass}">${escHtml(inc.priority||'Unknown')}</span></td></tr>
        <tr><td>Source</td><td>Amherst Fire Control · Scanner · Groq Whisper</td></tr>
      </table>
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() {
  if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl = null; }
  document.getElementById('modal-overlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModalDirect(); }
});

// ── SSE live feed — carries both incident cards and flat log lines ────────
const sseStream = new EventSource(STREAM_API);
sseStream.onopen  = () => setConn(true);
sseStream.onerror = () => setConn(false);
sseStream.onmessage = (event) => {
  let msg; try { msg = JSON.parse(event.data); } catch(e) { return; }
  if (!msg || !msg.kind || !msg.data) return;

  if (msg.kind === 'incident') {
    const inc = msg.data;
    if (knownIds.has(String(inc.id))) return;
    knownIds.add(String(inc.id)); // mark seen regardless of validity
    // No valid "number + street" address — skip the incident card. It's
    // still audible/readable in the Radio Log panel, which is a separate
    // feed fed by 'log' messages below.
    if (!isValidAddress(inc.location)) return;
    incidentMap[String(inc.id)] = inc;
    allIncidents.unshift(inc);

    const feed = document.getElementById('incident-feed');
    if (feed.querySelector('.empty')) feed.innerHTML = '';
    feed.insertAdjacentHTML('afterbegin', renderRow(inc));

    fetchStats();
    showToast(inc);
    return;
  }

  if (msg.kind === 'log') {
    const entry = msg.data;
    if (knownLogIds.has(String(entry.id))) return;
    knownLogIds.add(String(entry.id));

    const tfeed = document.getElementById('transcript-feed');
    tfeed.insertAdjacentHTML('afterbegin', renderLogEntry(entry));
  }
};

// ── Paginated fetch: incidents ─────────────────────────────────────────────
async function fetchIncidents(offset = 0) {
  if (isLoading || allLoaded) return;
  isLoading = true;
  try {
    const res = await fetch(`${API}?offset=${offset}`);
    if (!res.ok) throw new Error();
    const incidents = await res.json();
    setConn(true);

    const feed = document.getElementById('incident-feed');
    if (offset === 0) { feed.innerHTML = ''; allIncidents = []; knownIds = new Set(); incidentMap = {}; }

    if (incidents.length === 0) { allLoaded = true; isLoading = false; return; }

    // Drop anything with an unknown/empty location — it still appears
    // normally in the Radio Log panel, just not as an incident card.
    const unseen = incidents.filter(i => !knownIds.has(String(i.id)));
    unseen.forEach(i => {
      knownIds.add(String(i.id)); // mark seen regardless of validity, so it's never re-checked
      if (!isValidAddress(i.location)) return;
      incidentMap[String(i.id)] = i;
      allIncidents.push(i);
      feed.insertAdjacentHTML('beforeend', renderRow(i));
    });

    if (incidents.length < 50) allLoaded = true;
    else currentOffset = offset + 50;

    fetchStats();
  } catch(e) {
    setConn(false);
    console.error(e);
  }
  isLoading = false;
}

// ── Paginated fetch: radio log ─────────────────────────────────────────────
async function fetchLog(offset = 0) {
  if (isLogLoading || logAllLoaded) return;
  isLogLoading = true;
  try {
    const res = await fetch(`${LOG_API}?offset=${offset}`);
    if (!res.ok) throw new Error();
    const entries = await res.json();

    const tfeed = document.getElementById('transcript-feed');
    const newOnes = entries.filter(e => !knownLogIds.has(String(e.id)));
    if (newOnes.length === 0 || entries.length === 0) { logAllLoaded = true; isLogLoading = false; return; }

    newOnes.forEach(e => {
      knownLogIds.add(String(e.id));
      tfeed.insertAdjacentHTML('beforeend', renderLogEntry(e));
    });

    if (entries.length < 50) logAllLoaded = true;
    else logOffset = offset + 50;
  } catch(e) {
    console.error(e);
  }
  isLogLoading = false;
}

// Infinite scroll — incidents
document.getElementById('incident-feed').addEventListener('scroll', function() {
  if (allLoaded || isLoading) return;
  if (this.scrollTop + this.clientHeight >= this.scrollHeight - 150) {
    fetchIncidents(currentOffset);
  }
});
// Infinite scroll — radio log
document.getElementById('transcript-feed').addEventListener('scroll', function() {
  if (logAllLoaded || isLogLoading) return;
  if (this.scrollTop + this.clientHeight >= this.scrollHeight - 150) {
    fetchLog(logOffset);
  }
});

// ── Pull-to-refresh (mobile) — pulling down at the very top of the Active
// Calls feed shows a spinner and reloads the incidents from offset 0. ──────
(function initPullToRefresh() {
  const feed    = document.getElementById('incident-feed');
  const wrap    = document.getElementById('ptr-wrap');
  const spinner = document.getElementById('ptr-spinner');
  const THRESHOLD = 68;   // px of pull needed to trigger a refresh
  const MAX_PULL  = 100;  // visual cap on how far the indicator can be dragged
  const DAMPING   = 0.5;  // rubber-band feel — finger moves 2x the indicator

  let startY = 0, tracking = false, pullDist = 0, refreshing = false;

  feed.addEventListener('touchstart', (e) => {
    if (refreshing) return;
    tracking = feed.scrollTop <= 0;
    startY = e.touches[0].clientY;
    if (tracking) wrap.classList.add('no-transition');
  }, { passive: true });

  feed.addEventListener('touchmove', (e) => {
    if (!tracking || refreshing) return;
    // Bail out if the feed has scrolled away from the top mid-gesture.
    if (feed.scrollTop > 0) { tracking = false; resetIndicator(); return; }

    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { pullDist = 0; wrap.style.height = '0px'; spinner.style.opacity = '0'; return; }

    pullDist = Math.min(dy * DAMPING, MAX_PULL);
    wrap.style.height = pullDist + 'px';
    spinner.style.opacity = Math.min(pullDist / THRESHOLD, 1);
    spinner.style.transform = `rotate(${pullDist * 3.5}deg)`;
    e.preventDefault(); // stop the page from rubber-banding while we pull
  }, { passive: false });

  feed.addEventListener('touchend', () => {
    if (!tracking || refreshing) { tracking = false; return; }
    tracking = false;
    wrap.classList.remove('no-transition');
    if (pullDist >= THRESHOLD) {
      triggerRefresh();
    } else {
      resetIndicator();
    }
  });

  function resetIndicator() {
    wrap.classList.remove('no-transition');
    wrap.style.height = '0px';
    spinner.style.opacity = '0';
    spinner.style.transform = '';
    pullDist = 0;
  }

  function triggerRefresh() {
    refreshing = true;
    wrap.style.height = '46px';
    spinner.style.opacity = '1';
    spinner.style.transform = '';
    spinner.classList.add('spin');

    // Reload the Active Calls feed from the top.
    allLoaded = false;
    currentOffset = 0;
    Promise.resolve(fetchIncidents(0)).finally(() => {
      setTimeout(() => {
        spinner.classList.remove('spin');
        resetIndicator();
        refreshing = false;
        pullDist = 0;
      }, 350);
    });
  }
})();

fetchIncidents(0);
fetchLog(0);
fetchStats();
setInterval(fetchStats, 60000);
</script>
